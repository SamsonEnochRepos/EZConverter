appId: app.ezconverter.desktop
productName: EZConverter
directories: { output: release, buildResources: build }
files: ["dist/**", "package.json"]
extraResources:
  - { from: "../web/dist", to: "web" }
  # Converter sidecar: PyInstaller build of backend/ (scripts/build_sidecar.py).
  - { from: "sidecar", to: "sidecar", filter: ["**/*"] }
  # Bundled GPL engines (FFmpeg, Pandoc, Poppler) fetched by scripts/fetch_windows_engines.py, with their licenses.
  - { from: "engines", to: "engines", filter: ["**/*"] }
  - { from: "../../LICENSE", to: "licenses/EZConverter-LICENSE.txt" }
  - { from: "../../NOTICE", to: "licenses/EZConverter-NOTICE.txt" }
  - { from: "../../THIRD_PARTY_NOTICES.md", to: "licenses/THIRD_PARTY_NOTICES.md" }
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac: { category: public.app-category.productivity, hardenedRuntime: true, target: [dmg, zip] }
win:
  target: [nsis, zip]
  artifactName: "EZConverter-${version}-win-x64-portable.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "EZConverter-Setup-${version}-win-x64.${ext}"
copyright: "Copyright 2026 SamsonEnochRepos. Licensed under the Apache License, Version 2.0."
linux: { target: [AppImage, deb], category: Utility }
